version: '3.8'

services:
  backend:
    build:
      context: ./backend/springboot
      dockerfile: ../../infrastructure/docker/Dockerfile.backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev

  ai-service:
    build:
      context: ./ai-service/fastapi
      dockerfile: ../../infrastructure/docker/Dockerfile.ai
    ports:
      - "8000:8000"
